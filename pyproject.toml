[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unmask-llc"
version = "0.1.0"
description = "Automated Corporate Landlord Entity Resolution & Property Graph Engine"
readme = "README.md"
authors = [{ name = "UnmaskLLC Contributors" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
unmask-llc = "unmask_llc.cli:main"
